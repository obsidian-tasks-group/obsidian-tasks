pre-push:
  parallel: true
  commands:
    build:
      run: yarn build
    lint:
      run: yarn lint
    lint-markdown:
      run: yarn lint:markdown
    test:
      run: yarn test

pre-commit:
  parallel: false
  commands:
    lint:
      glob: '{src,tests}/{*,**/*}.{ts,svelte}'
      run: yarn eslint --fix "{staged_files}" && git add "{staged_files}"
    # svelte-check type-checks every .ts file in tsconfig.json too, not just .svelte files,
    # so it replaces tsc here and keeps every commit compiling (for git bisect).
    typecheck:
      glob: '*.{ts,svelte}'
      run: yarn svelte-check
    lint-markdown:
      glob: '*.md'
      run: yarn lint:markdown && git add "{staged_files}"
    test:
      glob: '*.ts'
      run: yarn vitest related --run "{staged_files}" --passWithNoTests
    test-json:
      glob: 'tests/Obsidian/__test_data__/*.json'
      run: yarn test
    test-svelte:
      glob: '*.svelte'
      run: yarn test

pre-push:
  parallel: true
  commands:
    build:
      run: yarn build
    lint:
      run: yarn lint
    lint-markdown:
      run: yarn lint:markdown
    test:
      run: yarn test

pre-commit:
  # Not parallel: `test` and `test-svelte` both invoke Jest, and concurrent Jest runs race on the
  # `approvals`-library's shared `*.received.*` temp files, causing intermittent ENOENT failures
  # unrelated to any actual code/test regression. Sequential is slower but reliable.
  parallel: false
  commands:
    lint:
      glob: '*.ts'
      run: yarn lint "{staged_files}" && git add "{staged_files}"
    lint-svelte:
      glob: '*.svelte'
      run: yarn lint && git add "{staged_files}"
    lint-markdown:
      glob: '*.md'
      run: yarn lint:markdown && git add "{staged_files}"
    test:
      glob: '*.ts'
      run: yarn test "{staged_files}" --findRelatedTests --passWithNoTests
    test-json:
      glob: 'tests/Obsidian/__test_data__/*.json'
      run: yarn test
    test-svelte:
      glob: '*.svelte'
      run: yarn test
